[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vault"
version = "0.1.0"
description = "Secure file encryption CLI"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
    "click>=8.0.0",
    "typer>=0.9.0",
]

[project.scripts]
vault = "vault.cli:app"

[tool.setuptools.packages]
find = {}

[dependency-groups]
dev = [
    "black>=25.11.0",
]
